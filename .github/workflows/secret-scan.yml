name: Secret scan

# Second layer of defence. GitHub secret scanning with push protection is the
# first, and blocks a recognised credential before it ever reaches the remote.
# This job catches what GitHub's partner-pattern list does not — notably this
# repo's own `pcp_` board tokens and BETTER_AUTH_SECRET assignments.
#
# Configuration and allowlist rationale: .gitleaks.toml
#
# The gitleaks binary is downloaded at a pinned version and checksum-verified
# rather than run via gitleaks-action, which requires a paid licence for
# organisation-owned repositories.
#
# To reproduce locally:
#   gitleaks dir . --config .gitleaks.toml --redact
#
# To verify the scanner still works after editing .gitleaks.toml, plant canary
# values in a scratch directory OUTSIDE the repo and confirm the rules fire:
#
#   mkdir -p /tmp/canary && cp .gitleaks.toml /tmp/canary/
#   # write one line per shape: a pcp_board_ token, a BETTER_AUTH_SECRET
#   # assignment, a GitHub PAT, and a Slack bot token, each with 16+ random chars
#   gitleaks dir /tmp/canary --config .gitleaks.toml --redact
#
# Expect possiblaw-board-token, possiblaw-better-auth-secret, github-pat and
# slack-bot-token to fire. A config that finds nothing may simply be broken, so
# prove it fires rather than trusting a clean run.
#
# Write the canaries OUTSIDE the repo. Literal credential-shaped strings in a
# tracked file trip these same rules — this comment did, on first draft. Note
# that workflow files are deliberately NOT allowlisted: a real credential
# committed to CI config is a plausible leak path, so the blind spot would cost
# more than the inconvenience.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Submodules are deliberately NOT checked out: .gitleaks.toml excludes
      # paperclip/ and harvey-lab/, which we never modify (layer-not-fork), and
      # skipping them takes the scan from ~133 MB to ~9 MB.
      - name: Check out the repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: false

      - name: Install gitleaks at a verified checksum
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      - name: Scan the working tree
        run: ./gitleaks dir . --config .gitleaks.toml --no-banner --redact --exit-code 1
