projects:
  nda-matters:
    leadAgentSlug: chief-of-staff
    status: in_progress
    color: "#155EEF"
    metadata:
      possiblaw:
        workflow: nda-vertical-slice
  commercial-reviews:
    leadAgentSlug: chief-of-staff
    status: in_progress
    color: "#9333EA"
    metadata:
      possiblaw:
        workflow: contract-review-vertical-slice
  eval-results:
    leadAgentSlug: chief-of-staff
    status: planned
    color: "#10B981"
    metadata:
      possiblaw:
        workflow: eval-results
        note: >
          Placeholder for the planned eval pipeline. Lead agent is chief-of-staff
          until the dedicated eval-judge agent ships. See companies/legal-operations/evals/
          for the convention.
tasks:
  draft-mutual-nda-demo:
    status: backlog
    priority: medium
    billingCode: demo
    metadata:
      possiblaw:
        demo: true
  review-vendor-msa-demo:
    status: backlog
    priority: medium
    billingCode: demo
    metadata:
      possiblaw:
        demo: true
  weekly-renewal-scan:
    status: backlog
    priority: low
    recurring: true
    routine:
      concurrencyPolicy: coalesce_if_active
      catchUpPolicy: skip_missed
      triggers:
        - kind: schedule
          cronExpression: "0 9 * * 1"
          timezone: America/Chicago
          enabled: true
    metadata:
      possiblaw:
        routine: weekly-renewal-scan
routines:
  nightly-conflicts-check:
    triggers:
      - kind: schedule
        cronExpression: "0 2 * * *"
        timezone: America/Chicago
        enabled: true
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
