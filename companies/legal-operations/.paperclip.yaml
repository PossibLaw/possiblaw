schema: paperclip/v1
company:
  brandColor: "#F97316"
  attachmentMaxBytes: 10485760
  requireBoardApprovalForNewAgents: true
  feedbackDataSharingEnabled: false
agents:
  chief-of-staff:
    role: executive-router
    icon: route
    capabilities: Intake, domain routing, delegation, notifications, and operator escalation.
    budgetMonthlyCents: 0
    adapter:
      type: codex_local
      config:
        model: gpt-5.5
        modelReasoningEffort: high
        dangerouslyBypassApprovalsAndSandbox: true
        timeoutSec: 600
    runtime:
      heartbeat:
        enabled: false
        intervalSec: 0
        wakeOnAssignment: true
        wakeOnOnDemand: true
        wakeOnAutomation: true
    inputs:
      env:
        PAPERCLIP_BASE_URL:
          kind: plain
          requirement: optional
          default: "http://127.0.0.1:3100"
        POSSIBLAW_SLACK_WEBHOOK_URL:
          kind: secret
          requirement: optional
        POSSIBLAW_TEAMS_WEBHOOK_URL:
          kind: secret
          requirement: optional
    metadata:
      possiblaw:
        modelLane: primary
        adapterDecision: codex-local-default-2026-05-22
  firm-facade-recorder:
    role: service-principal
    icon: receipt-text
    capabilities: Service-only identity for recording firm-facade receipts through the gate proxy.
    budgetMonthlyCents: 0
    adapter:
      type: codex_local
      config:
        model: gpt-5.5
        modelReasoningEffort: low
        dangerouslyBypassApprovalsAndSandbox: false
        timeoutSec: 60
    runtime:
      heartbeat:
        enabled: false
        intervalSec: 0
        wakeOnAssignment: false
        wakeOnDemand: false
        wakeOnOnDemand: false
        wakeOnAutomation: false
    metadata:
      possiblaw:
        serviceOnly: true
        # Reuse a defined lane so every variant renders without an unknown-lane
        # warning. Runtime wake paths remain disabled; this is not permission
        # for the service principal to perform agent work.
        modelLane: routing
        adapterDecision: service-identity-never-run-2026-07-15
