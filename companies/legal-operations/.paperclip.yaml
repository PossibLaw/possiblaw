        POSSIBLAW_PRIVACY_KEY_DIR:
          kind: plain
          requirement: optional
        POSSIBLAW_PRIVACY_WORDLIST:
          kind: plain
          requirement: optional
        POSSIBLAW_PRIVACY_MONEY_FLOOR:
          kind: plain
          requirement: optional
          default: "10000"
    metadata:
      possiblaw:
        modelLane: drafting
        adapterDecision: codex-local-default-2026-05-22
  contract-reviewer:
