tasks:
  draft-mutual-nda-demo:
    status: backlog
    priority: medium
    billingCode: demo
    metadata:
      possiblaw:
        demo: true
  review-vendor-msa-demo:
    status: backlog
    priority: medium
    billingCode: demo
    metadata:
      possiblaw:
        demo: true
  weekly-renewal-scan:
    status: backlog
    priority: low
    recurring: true
    routine:
      concurrencyPolicy: coalesce_if_active
      catchUpPolicy: skip_missed
      triggers:
        - kind: schedule
          cronExpression: "0 9 * * 1"
          timezone: America/Chicago
          enabled: true
    metadata:
      possiblaw:
        routine: weekly-renewal-scan
routines:
  # nightly-conflicts-check was removed 2026-08-01: it declared a schedule but
  # never named an owning agent, no skill references it, and automated conflicts
  # screening is not implemented in this package (see
  # skills/legal-conflicts-check — the screen is a human-confirmation step).
  # Reintroduce it only together with the deterministic conflicts party-screen
  # (Sprint F WP-F2 item 4) and an explicit agent binding.
  delivery-sweep:
    # Intent declaration: deliverables-courier scans recently completed work
    # products and files `mode: auto` policy matches. The importer does not
    # lift routine bindings; the operator wires the schedule in the UI.
    triggers:
      - kind: schedule
        cronExpression: "0 18 * * 1-5"
        timezone: America/Chicago
        enabled: true
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
  learning-sweep:
    # Intent declaration: learning-scribe sweeps recently completed matters for
    # lawyer feedback and "remember this" comments, generalizes them into
    # sanitized firm-memory lessons, and posts human-approval cards. The
    # importer does not lift routine bindings; the operator wires the schedule
    # in the UI.
    triggers:
      - kind: schedule
        cronExpression: "0 3 * * *"
        timezone: America/Chicago
        enabled: true
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
  skill-improvement-sweep:
    # Intent declaration: skill-improvement-scribe diffs finalized delivered
    # documents against their drafts and queues sanitized skill-edit proposals
    # for the morning review; the importer does not lift routine bindings; the
    # operator wires the schedule in the UI.
    triggers:
      - kind: schedule
        cronExpression: "0 4 * * *"
        timezone: America/Chicago
        enabled: true
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
  matter-intake-sweep:
    # Intent declaration: chief-of-staff sweeps for unassigned, top-level,
    # human-untouched To Do matters and assigns itself to each (claim-only). The
    # assignment-wake then runs chief-of-staff's normal per-issue triage +
    # delegation, so an operator can drop a matter in To Do without assigning
    # anyone. Every-15-min on weekday business hours (Central). The importer does
    # not lift routine bindings; the operator wires the schedule + the
    # chief-of-staff binding in the routines UI.
    triggers:
      - kind: schedule
        cronExpression: "*/15 8-18 * * 1-5"
        timezone: America/Chicago
        enabled: true
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
