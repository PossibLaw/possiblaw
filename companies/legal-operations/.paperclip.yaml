schema: paperclip/v1
company:
  brandColor: "#155EEF"
  attachmentMaxBytes: 10485760
  requireBoardApprovalForNewAgents: true
  feedbackDataSharingEnabled: false
agents:
  chief-of-staff:
    role: executive-router
    icon: route
    capabilities: Intake, domain routing, delegation, notifications, and operator escalation.
    budgetMonthlyCents: 0
    adapter:
      type: codex_local
      config:
        model: gpt-5.3-codex
        modelReasoningEffort: high
        dangerouslyBypassApprovalsAndSandbox: true
        timeoutSec: 600
    runtime:
      heartbeat:
        enabled: false
        intervalSec: 0
        wakeOnAssignment: true
        wakeOnOnDemand: true
        wakeOnAutomation: true
    inputs:
      env:
        PAPERCLIP_BASE_URL:
          kind: plain
          requirement: optional
          default: "http://127.0.0.1:3100"
        POSSIBLAW_SLACK_WEBHOOK_URL:
          kind: secret
          requirement: optional
        POSSIBLAW_TEAMS_WEBHOOK_URL:
          kind: secret
          requirement: optional
    metadata:
      possiblaw:
        modelLane: primary
        adapterDecision: codex-local-default-2026-05-22
  chief-counsel:
    role: legal-router
    icon: scale
    capabilities: Legal practice-area classification and legal-team delegation.
    budgetMonthlyCents: 0
    adapter:
      type: codex_local
      config:
        model: gpt-5.3-codex
        modelReasoningEffort: high
        dangerouslyBypassApprovalsAndSandbox: true
        timeoutSec: 600
    runtime:
      heartbeat:
        enabled: false
        intervalSec: 0
        wakeOnAssignment: true
        wakeOnOnDemand: true
        wakeOnAutomation: true
    inputs:
      env:
        PAPERCLIP_BASE_URL:
          kind: plain
          requirement: optional
          default: "http://127.0.0.1:3100"
        POSSIBLAW_SLACK_WEBHOOK_URL:
          kind: secret
          requirement: optional
    metadata:
      possiblaw:
        modelLane: primary
        adapterDecision: codex-local-default-2026-05-22
  commercial-lead:
    role: practice-lead
    icon: briefcase-business
    capabilities: Commercial-contract triage, review dispatch, and specialist delegation.
    budgetMonthlyCents: 0
