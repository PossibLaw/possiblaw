        POSSIBLAW_PRIVACY_WORDLIST:
          kind: plain
          requirement: optional
    metadata:
      possiblaw:
        modelLane: review
        adapterDecision: codex-local-default-2026-05-22
        sources:
          - kind: github
            repo: AnttiHero/lavern
            commit: e04d3a6
            license: Apache-2.0
            attribution: AnttiHero and contributors to lavern
