# gate-policy.yaml — Per-firm gate policy for the PossibLaw Gate Proxy.
#
# Graded enforcement: allow = pass-through + receipt (SOFT);
#   anonymize / human / block = hard gate (agent pauses until resolved).
#
# Receipts land in ~/.possiblaw/gate-receipts/<data-dir>/receipts.jsonl (one line appended per egress event, SHA-256 hash-chained).
#
# Every value below is the firm's to tune. Edit this file in your clone.
# Restart the proxy after edits; it reads this file at startup only.
#
# version is required to be 1 and is validated on load.
version: 1

boundaries:
  # Data leaving the firm's environment to a third-party service (email,
  # external shares, or an upload outside an exact configured firm review
  # destination) requires human approval. Production trusted-firm uploads are
  # the narrow exception: the authenticated courier supplies a destinationId
  # alias, and the gate resolves it to a launcher-compiled Drive/OneDrive tuple
  # before hashing or dispatch. Raw vendor folder/drive/page selectors are
  # rejected in authenticated mode.
  THIRD_PARTY_EGRESS: human

  # Confidential or privileged content sent to a cloud inference endpoint.
  # Anonymize strips known entities before the payload leaves the perimeter.
  CONFIDENTIAL_TO_CLOUD: anonymize

  # Filing a document with a court or tribunal — irreversible once docketed.
  # A human reviews and confirms before the agent proceeds.
  COURT_FILING: human

  # DocuSign / binding acceptance — a human signs, always.
  SIGNATURE: human

  # Wire transfers, ACH, or any cash movement — a human authorizes, always.
  MONEY_MOVEMENT: human

  # Any external write that cannot be undone (delete, publish, deploy).
  # A human confirms before the agent proceeds.
  IRREVERSIBLE_EXTERNAL_OP: human

# ---------------------------------------------------------------------------
# Citation gate (Phase 2 — OUTBOUND_QUALITY)
# ---------------------------------------------------------------------------
# Boundaries listed here additionally require a registered, payload-bound
# citation verification whenever the outbound document carries detectable legal
# citations. Egress whose text has NO detectable citations passes untouched
# (nothing to re-check). A gated send/file of a citation-bearing document is
# blocked 403 until the citation checker registers a passing verification for
# that exact text (POST /quality/citation). See docs/connectors-inventory.md
# "Citation gate" for the agent-facing remediation flow.
#
# Default covers court filings and any third-party egress. Narrow to
# [COURT_FILING] to gate only filings; set an empty list to disable the gate.
citationGate:
  boundaries: [COURT_FILING, THIRD_PARTY_EGRESS]

# ---------------------------------------------------------------------------
# Tuning examples
# ---------------------------------------------------------------------------

# To restore permissive demo behavior outside production, an operator may set
# THIRD_PARTY_EGRESS to allow explicitly. Do not use that override for a firm
# deployment: it makes email and untrusted external delivery pass-through.

# Citation gate + authority provenance (anti-hallucination). Retrieved
# authorities are registered with the gate (POST /quality/authority); the gate
# flags any authority CITED in an outbound filing that was never RETRIEVED. By
# default this is RECORD/FLAG only (logged on the egress receipt as
# meta.unbackedCitations) and does NOT block. Set requireAuthorityProvenance:
# true to BLOCK an outbound document on a citation-gated boundary when it cites
# one or more never-retrieved authorities. Defaults: boundaries
# [COURT_FILING, THIRD_PARTY_EGRESS], requireAuthorityProvenance false.
#
# citationGate:
#   boundaries: [COURT_FILING, THIRD_PARTY_EGRESS]
#   requireAuthorityProvenance: true

# ---------------------------------------------------------------------------
# Firm-facing MCP facade (Phase 3)
# ---------------------------------------------------------------------------
#
# Default CLOSED. When allowWorkProductText is set to the literal boolean true,
# the fetch_work_product MCP tool may return full privileged document text to a
# connected outside assistant when the caller sets include_text: true.
#
# Every such disclosure is receipted (outcome:"performed", meta.textDisclosed:true).
# No document body text ever enters the receipt — only the disclosure flag.
#
# Leave false (or omit) to keep all document bodies withheld from the MCP channel.
firmFacade:
  allowWorkProductText: false

# ---------------------------------------------------------------------------
# Execution trace spine
# ---------------------------------------------------------------------------
#
# The receipt chain above records what LEFT the firm. The trace store records
# how the decision to send it was reached: which model ran, when, what prompt
# went in, what context and connectors were pulled, what came out.
#
# Traces are the content-bearing half of a deliberate split. Receipts stay
# hash-only and shareable; trace content never leaves the firm perimeter, is
# partitioned per matter, and is read only by the roles named below.
#
# Default CLOSED. Every malformed value below — a string "true", an
# unrecognised capture mode, an unknown role, a typo'd key — closes the store
# entirely rather than taking a default. Nothing is recorded until an operator
# opts in deliberately.
#
#   capture: hashes-only   Record the decision (model, lane, timing, context
#                          refs, cost) plus a SHA-256 of the prompt/output.
#                          Proves exactly which prompt ran without storing it.
#                          Safe default for a managed-service posture.
#
#   capture: full          Additionally retain prompt, system prompt and model
#                          output. Appropriate on a firm's OWN tenant, where
#                          prompt access is the point of the feature. Requires
#                          at least one entry in contentRoles — capturing text
#                          no one may read is liability without benefit, so
#                          that combination is rejected.
#
# contentRoles: who may read captured content. One or more of:
#   admin, supervising-lawyer, auditor, agent
# Any role not listed sees the full audit row with the content stripped —
# denial is not an error, it is a redaction.
#
# retentionDays: how long content is kept (default 90). A retention purge
# removes the privileged text ONLY; the record, its hash, and any receipt bound
# to it survive, so attestation over the matter stays verifiable for its life.
#
# trace:
#   enabled: true
#   capture: full
#   contentRoles: [admin, supervising-lawyer]
#   retentionDays: 90
trace:
  enabled: false

# ---------------------------------------------------------------------------
# Documented unreceipted-egress exceptions (v1) — a decision, not an accident
# ---------------------------------------------------------------------------
#
# Some egress paths do NOT traverse the gate proxy in v1. They are listed here
# so the boundary is an explicit, reviewed decision. These are documentation
# notes only — there is no schema key below and nothing is enforced by the
# proxy. The full write-up is docs/known-limitations.md > "Unreceipted egress
# channels".
#
# 1. Operator notifications (notify-slack / notify-teams). The webhook POST
#    goes straight from the agent runner to Slack/Teams — no receipt, no
#    human-approval gate, no tier-floor. Mitigation is a HARD CONTENT RULE in
#    the two skills: the message body is a fixed template (matter slug, issue
#    URL, gate/blocked status line, agent slug) and NEVER carries client names,
#    matter facts, document text, work-product quotes, or UNTRUSTED-CONTENT.
#    A gate-proxy notify tool that would receipt/gate these is later work.
#
# 2. Synced deliverables folder. Pointing POSSIBLAW_DELIVERABLES_DIR at a
#    cloud-synced folder (iCloud/Dropbox/OneDrive/Google Drive) exports every
#    written draft with no receipt or tier gate — the sync client, not the
#    proxy, moves the bytes. The gated courier path (upload_document) is the
#    supported cloud delivery. See output-storage-config for the operator-owned
#    risk and the syncBypassAcknowledged convention.
#
# 3. Research queries (Westlaw, Lexis, CourtListener) — see the next block.
#
# ---------------------------------------------------------------------------
# Out-of-scope in v1
# ---------------------------------------------------------------------------
#
# Research connectors (Westlaw, Lexis, CourtListener) are NOT proxied in v1.
# Queries sent to these services can carry privileged facts in the request.
# Firms wanting those egress paths gated should raise the request and point to
# docs/connectors-inventory.md for the current connector inventory.
