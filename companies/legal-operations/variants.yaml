# PossibLaw variant matrix
#
# Maps `metadata.possiblaw.modelLane` (set per agent in .paperclip.yaml) to
# adapter + model overrides at company-import time. Pivoting on lane lets the
# 178-agent package inherit the right config automatically without
# per-agent variant boilerplate — this file grew from an original 11-agent
# slice to today's full catalog with no changes needed here.
#
# Consumed by `bin/_possiblaw_variants.py` and applied by `bin/possiblaw` as
# `adapterOverrides` on POST /api/companies/import.
#
# Lanes used in this package: primary, routing, drafting, review, extractive.
# Add new lanes (or new variants) by extending this file; agents inherit the
# new lane the moment they declare it.

schema: possiblaw/variants/v1

# ---------------------------------------------------------------------------
# dataTerms — privacy posture of each variant's egress lane.
# ---------------------------------------------------------------------------
# Consumed by the gate-proxy tier-floor (gate-proxy/src/gates/tier-floor.ts).
# Legal basis: docs/privilege-and-confidentiality.md. The gate reasons about a
# cloud lane's CONTRACTED DATA TERMS, not just binary cloud-vs-local:
#
#   dataTerms:
#     tier: cloud            # cloud | local
#     zdr: true              # zero data retention contracted (the load-bearing term)
#     trains: false          # provider trains on inputs/outputs → HARD BLOCK if true
#     humanReview: false     # provider human-review of content
#     tenantIsolated: true   # tenant-isolated deployment
#     consumerEndpoint: false# consumer-subscription endpoint → HARD BLOCK if true
#
# Policy (tier-floor.ts):
#   - standard     → cloud OK under enterprise terms.
#   - confidential → cloud OK ONLY if zdr && !trains && !humanReview &&
#                    tenantIsolated; else prefer local / anonymize.
#   - privileged   → local, OR strict-ZDR cloud under explicit counsel direction.
#   - ANY tier on trains:true OR consumerEndpoint:true → HARD BLOCK (cannot be
#     overridden by tier or counsel direction). This is the only configuration
#     the case law condemns (U.S. v. Heppner).
#
# The operator ASSERTS these terms (we trust + record, we do not verify the
# underlying contract). Defaults below are deliberately CONSERVATIVE: an unknown
# or under-asserted cloud lane must NOT silently qualify as confidential-capable.
# zdr is only set true where the provider's enterprise/API contract documents
# zero data retention by default; set it false (or leave it) for any lane whose
# ZDR terms the operator has not confirmed.

variants:
  codex:
    label: "Codex CLI (subscription)"
    # ChatGPT-subscription lane: enterprise ZDR terms are NOT asserted for the
    # subscription account, so it does not qualify as confidential-capable. Not a
    # consumer training endpoint (Codex CLI rides API-style no-train), so it is
    # not hard-blocked — but confidential/privileged matters route local/anonymize.
    dataTerms:
      tier: cloud
      zdr: false
      trains: false
      humanReview: false
      tenantIsolated: true
      consumerEndpoint: false
    requires_cli: codex
    notes: >
      ChatGPT-subscription accounts only get the default model lineup — probed
      2026-06-09 on codex 0.137: gpt-5.3-codex and gpt-5.5-codex return "not
      supported when using Codex with a ChatGPT account"; gpt-5.5 works. If a
      future codex release moves the default model again, the launcher's
      preflight probe will catch it at launch.
    default:
      adapterType: codex_local
      adapterConfig:
        model: gpt-5.5
        modelReasoningEffort: medium
        dangerouslyBypassApprovalsAndSandbox: true
        timeoutSec: 600
    lanes:
      primary:
        modelReasoningEffort: high
      routing:
        modelReasoningEffort: medium
      drafting:
        modelReasoningEffort: high
        timeoutSec: 900
      review:
        modelReasoningEffort: high
        timeoutSec: 900
      extractive:
        modelReasoningEffort: medium
    per_agent: {}

  codex-api:
    label: "Codex CLI (API key)"
    # OpenAI API key lane: no-train by default since Mar 2023; ZDR available to
    # API/Enterprise customers (docs/privilege-and-confidentiality.md). Operator
    # asserts the ZDR contract is in place → confidential-capable.
    dataTerms:
      tier: cloud
      zdr: true
      trains: false
      humanReview: false
      tenantIsolated: true
      consumerEndpoint: false
    requires_cli: codex
    secret_env:
      OPENAI_API_KEY: "OpenAI API Key"
    notes: >
      Same lanes as the codex variant, but billed against an OpenAI API key
      instead of the ChatGPT subscription. Export OPENAI_API_KEY in the shell
      that runs bin/possiblaw; the launcher stores it once as a paperclip
      company secret and binds it to every agent via a secret_ref env binding —
      the key never lands in package files or the import body. Pinned to
      gpt-5.5-codex, the codex-tuned model the ChatGPT-account path rejects but
      the API serves (UNCONFIRMED against a live key; the preflight probe
      verifies at launch).
    default:
      adapterType: codex_local
      adapterConfig:
        model: gpt-5.5-codex
        modelReasoningEffort: medium
        dangerouslyBypassApprovalsAndSandbox: true
        timeoutSec: 600
    lanes:
      primary:
        modelReasoningEffort: high
      routing:
        modelReasoningEffort: medium
      drafting:
        modelReasoningEffort: high
        timeoutSec: 900
      review:
        modelReasoningEffort: high
        timeoutSec: 900
      extractive:
        modelReasoningEffort: medium
    per_agent: {}

  claude:
    label: "Claude CLI (subscription)"
    # Claude subscription lane: ZDR terms not asserted for the subscription
    # account → not confidential-capable. No-train default holds, so it is not a
    # hard-blocked consumer training endpoint.
    dataTerms:
      tier: cloud
      zdr: false
      trains: false
      humanReview: false
      tenantIsolated: true
      consumerEndpoint: false
    requires_cli: claude
    default:
      adapterType: claude_local
      adapterConfig:
        model: claude-opus-4-7
        timeoutSec: 600
    lanes:
      primary:
        model: claude-opus-4-7
      routing:
        model: claude-sonnet-4-6
      drafting:
        model: claude-opus-4-7
        timeoutSec: 900
      review:
        model: claude-opus-4-7
        timeoutSec: 900
      extractive:
        model: claude-haiku-4-5
    per_agent: {}

  claude-api:
    label: "Claude CLI (API key)"
    # Anthropic API key lane: API traffic is not used for model training by
    # default and ZDR is contractable for enterprise/API customers
    # (docs/privilege-and-confidentiality.md). Operator asserts ZDR is in place →
    # confidential-capable.
    dataTerms:
      tier: cloud
      zdr: true
      trains: false
      humanReview: false
      tenantIsolated: true
      consumerEndpoint: false
    requires_cli: claude
    secret_env:
      ANTHROPIC_API_KEY: "Anthropic API Key"
    notes: >
      Same models and lanes as the claude variant, but billed against an
      Anthropic API key instead of the Claude subscription. Export
      ANTHROPIC_API_KEY in the shell that runs bin/possiblaw; the launcher
      stores it once as a paperclip company secret and binds it to every agent
      via a secret_ref env binding — the key never lands in package files or
      the import body. Use this when the subscription tier rejects models with
      "you don't have access" errors.
    default:
      adapterType: claude_local
      adapterConfig:
        model: claude-opus-4-7
        timeoutSec: 600
    lanes:
      primary:
        model: claude-opus-4-7
      routing:
        model: claude-sonnet-4-6
      drafting:
        model: claude-opus-4-7
        timeoutSec: 900
      review:
        model: claude-opus-4-7
        timeoutSec: 900
      extractive:
        model: claude-haiku-4-5
    per_agent: {}

  ollama:
    label: "Ollama (fully local — via OpenCode)"
    # Fully local: nothing leaves the machine → trivially compliant.
    dataTerms:
      tier: local
      zdr: true
      trains: false
      humanReview: false
      tenantIsolated: true
      consumerEndpoint: false
    requires_cli: opencode
    requires_ollama: true
    requires_opencode_provider: ollama
    local: true
    default:
      adapterType: opencode_local
      adapterConfig:
        model: ollama/llama3.1:8b
        timeoutSec: 900
        dangerouslySkipPermissions: true
    lanes:
      primary:
        model: ollama/llama3.1:70b
      routing:
        model: ollama/llama3.1:8b
      drafting:
        model: ollama/llama3.1:70b
        timeoutSec: 1200
      review:
        model: ollama/llama3.1:70b
        timeoutSec: 1200
      extractive:
        model: ollama/llama3.1:8b
    notes: >
      Uses Paperclip's opencode_local adapter to reach Ollama. The operator must
      have Ollama running locally AND a one-time OpenCode global config declaring
      the 'ollama' provider in ~/.config/opencode/opencode.json. The launcher's
      preflight verifies both and offers to write the OpenCode config on first run.
      Pin currency: unlike the OpenRouter-backed variants, there is no catalog
      check for Ollama tags — the launcher preflight confirms the daemon and
      OpenCode config are reachable, not that llama3.1:8b/llama3.1:70b are still
      the best locally-pullable choice. Their currency against Ollama's current
      model library is UNCONFIRMED / not re-verified by this repo; an operator
      wanting a newer local model should edit these pins directly and pull the
      corresponding tag.
    per_agent: {}

  llamacpp:
    label: "llama.cpp (fully local — HF GGUF via OpenCode)"
    # Fully local: nothing leaves the machine → trivially compliant.
    dataTerms:
      tier: local
      zdr: true
      trains: false
      humanReview: false
      tenantIsolated: true
      consumerEndpoint: false
    requires_cli: opencode
    requires_endpoint: "http://127.0.0.1:8080/v1/models"
    endpoint_hint: "start llama-server first, e.g.: llama-server -hf <org>/<model>-GGUF --port 8080"
    requires_opencode_provider: llamacpp
    local: true
    notes: >
      Runs Hugging Face GGUF models through a local llama.cpp server
      (llama-server) without the Ollama client. Rides Paperclip's
      opencode_local adapter; the OpenCode global config must declare a
      'llamacpp' provider (npm @ai-sdk/openai-compatible, baseURL
      http://127.0.0.1:8080/v1) — the launcher offers to write it on first
      run. llama-server serves whichever model it was started with and
      ignores the requested model name, so every lane pins 'llamacpp/default';
      pick quality by starting llama-server with the GGUF you want.
    default:
      adapterType: opencode_local
      adapterConfig:
        model: llamacpp/default
        timeoutSec: 900
        dangerouslySkipPermissions: true
    lanes:
      primary: {}
      routing: {}
      drafting:
        timeoutSec: 1200
      review:
        timeoutSec: 1200
      extractive: {}
    per_agent: {}

  opencode:
    label: "OpenCode Zen (OpenCode's model gateway, API key)"
    # Third-party gateway (OpenCode Zen) in front of upstream model providers.
    # ZDR across the gateway + upstream chain is NOT operator-confirmed →
    # conservative zdr:false (not confidential-capable). Not a consumer training
    # endpoint by default, so not hard-blocked. Operator may set zdr:true only
    # after confirming Zen's contracted retention terms end-to-end.
    dataTerms:
      tier: cloud
      zdr: false
      trains: false
      humanReview: false
      tenantIsolated: true
      consumerEndpoint: false
    requires_cli: opencode
    secret_env:
      OPENCODE_API_KEY: "OpenCode Zen API Key"
    notes: >
      First-class OpenCode: models served by OpenCode's own Zen gateway under
      a single OPENCODE_API_KEY — no other vendor logins. Lane pins mirror
      the claude variant 1:1 because Zen serves the same Claude models
      (verified against the models.dev registry 2026-06-09). To ride a
      different provider you have connected via `opencode auth login`
      instead, edit the lane models to that provider's prefix (for example
      anthropic/claude-opus-4-7).
    default:
      adapterType: opencode_local
      adapterConfig:
        model: opencode/claude-opus-4-7
        timeoutSec: 600
        dangerouslySkipPermissions: true
    lanes:
      primary:
        model: opencode/claude-opus-4-7
      routing:
        model: opencode/claude-sonnet-4-6
      drafting:
        model: opencode/claude-opus-4-7
        timeoutSec: 900
      review:
        model: opencode/claude-opus-4-7
        timeoutSec: 900
      extractive:
        model: opencode/claude-haiku-4-5
    per_agent: {}

  openrouter:
    label: "OpenRouter (multi-vendor cloud catalog, API key)"
    # Multi-vendor catalog: traffic may route across many upstream providers
    # whose retention/training terms vary per model. ZDR cannot be asserted
    # uniformly → conservative zdr:false (not confidential-capable). Default
    # OpenRouter does not train, so trains:false / not hard-blocked; but operators
    # routing confidential matters should prefer a single-provider ZDR lane.
    dataTerms:
      tier: cloud
      zdr: false
      trains: false
      humanReview: false
      tenantIsolated: false
      consumerEndpoint: false
    requires_cli: opencode
    secret_env:
      OPENROUTER_API_KEY: "OpenRouter API Key"
    notes: >
      Rides Paperclip's opencode_local adapter through OpenCode's native
      openrouter provider — no opencode.json block needed; OpenCode enables
      the provider when OPENROUTER_API_KEY is present in the agent process
      env (models.dev registry entry, checked 2026-06-09). Lane pins mirror
      the claude variant via OpenRouter model IDs — note OpenRouter uses
      dots (claude-opus-4.7) where Anthropic-direct uses dashes. All three
      pins verified in the public catalog on 2026-06-09; the launcher
      preflight re-checks them against openrouter.ai/api/v1/models at launch.
    default:
      adapterType: opencode_local
      adapterConfig:
        model: openrouter/anthropic/claude-opus-4.7
        timeoutSec: 600
        dangerouslySkipPermissions: true
    lanes:
      primary:
        model: openrouter/anthropic/claude-opus-4.7
      routing:
        model: openrouter/anthropic/claude-sonnet-4.6
      drafting:
        model: openrouter/anthropic/claude-opus-4.7
        timeoutSec: 900
      review:
        model: openrouter/anthropic/claude-opus-4.7
        timeoutSec: 900
      extractive:
        model: openrouter/anthropic/claude-haiku-4.5
    per_agent: {}

  gemini:
    label: "Gemini CLI (subscription)"
    # Gemini subscription lane (OAuth login): consumer/subscription Gemini terms
    # historically reserve content for product improvement / human review unless
    # the operator is on a no-train enterprise tier. Conservative zdr:false and
    # humanReview:true → not confidential-capable. NOT flagged consumerEndpoint
    # here (would hard-block standard work too); operators with confidential
    # matters must use gemini-api under enterprise ZDR terms.
    dataTerms:
      tier: cloud
      zdr: false
      trains: false
      humanReview: true
      tenantIsolated: true
      consumerEndpoint: false
    requires_cli: gemini
    notes: >
      Rides paperclip's gemini_local adapter. Auth via the gemini CLI's stored
      OAuth login; no API key needed. Model pins verified against the adapter's
      catalog (paperclip/packages/adapters/gemini-local/src/index.ts) on
      2026-06-09: gemini-2.5-pro / gemini-2.5-flash / gemini-2.5-flash-lite.
      gemini_local exposes no reasoning-effort knob, so lanes differ by model
      and timeout only. Install: npm install -g @google/gemini-cli.
    default:
      adapterType: gemini_local
      adapterConfig:
        model: gemini-2.5-pro
        timeoutSec: 600
    lanes:
      primary:
        model: gemini-2.5-pro
      routing:
        model: gemini-2.5-flash
      drafting:
        model: gemini-2.5-pro
        timeoutSec: 900
      review:
        model: gemini-2.5-pro
        timeoutSec: 900
      extractive:
        model: gemini-2.5-flash-lite
    per_agent: {}

  gemini-api:
    label: "Gemini CLI (API key)"
    # Gemini API / Vertex enterprise lane: paid API traffic is not used for
    # training and ZDR / no-human-review is contractable for enterprise customers.
    # Operator asserts the enterprise ZDR contract → confidential-capable.
    dataTerms:
      tier: cloud
      zdr: true
      trains: false
      humanReview: false
      tenantIsolated: true
      consumerEndpoint: false
    requires_cli: gemini
    secret_env:
      GEMINI_API_KEY: "Gemini API Key"
    notes: >
      Same models and lanes as the gemini variant, but billed against a Gemini
      API key. Export GEMINI_API_KEY in the shell that runs bin/possiblaw; the
      launcher stores it once as a paperclip company secret and binds it to
      every agent via a secret_ref env binding — the key never lands in package
      files or the import body. The adapter also honors GOOGLE_API_KEY; this
      variant binds GEMINI_API_KEY. Pins date-stamped 2026-06-09.
    default:
      adapterType: gemini_local
      adapterConfig:
        model: gemini-2.5-pro
        timeoutSec: 600
    lanes:
      primary:
        model: gemini-2.5-pro
      routing:
        model: gemini-2.5-flash
      drafting:
        model: gemini-2.5-pro
        timeoutSec: 900
      review:
        model: gemini-2.5-pro
        timeoutSec: 900
      extractive:
        model: gemini-2.5-flash-lite
    per_agent: {}

  openrouter-cost:
    label: "OpenRouter cost-tuned (GLM 5.2 cheap lanes, SOTA reasoning lanes)"
    # Same multi-vendor OpenRouter catalog as `openrouter`, same conservative
    # dataTerms posture (ZDR not asserted uniformly across upstream providers
    # -> zdr:false, not confidential-capable). This is the cost-frontier
    # experimental arm: routing/review/extractive lanes swap to GLM 5.2 to
    # measure cost vs. quality against Claude Opus on primary/drafting.
    dataTerms:
      tier: cloud
      zdr: false
      trains: false
      humanReview: false
      tenantIsolated: false
      consumerEndpoint: false
    requires_cli: opencode
    secret_env:
      OPENROUTER_API_KEY: "OpenRouter API Key"
    notes: >
      Experimental measurement variant for the orchestration eval's cost-frontier
      experiment (Experiment 2), not a general-purpose operating choice —
      routing/review/extractive lanes pin GLM 5.2 (openrouter/z-ai/glm-5.2)
      while primary/drafting stay on claude-opus-4.7, so the eval can compare
      cost and quality cell-by-cell. Added 2026-06-27 (CHANGELOG 0.31.0); the
      GLM 5.2 pin's currency against the live OpenRouter catalog beyond that
      date is UNCONFIRMED by this repo — rely on the launcher's keyless
      catalog preflight (the same check `openrouter` gets against
      openrouter.ai/api/v1/models) to catch drift at each launch, same as the
      other two pins in this block. GLM-5.2-vs-Claude-Opus quality is
      UNCONFIRMED — that comparison is the thesis under test; see
      docs/known-limitations.md → "Orchestration eval" → "GLM 5.2 quality vs.
      Claude Opus is UNCONFIRMED".
    default:
      adapterType: opencode_local
      adapterConfig:
        model: openrouter/anthropic/claude-opus-4.7
        timeoutSec: 600
        dangerouslySkipPermissions: true
    lanes:
      primary:
        model: openrouter/anthropic/claude-opus-4.7
      routing:
        model: openrouter/z-ai/glm-5.2
      drafting:
        model: openrouter/anthropic/claude-opus-4.7
        timeoutSec: 900
      review:
        model: openrouter/z-ai/glm-5.2
        timeoutSec: 900
      extractive:
        model: openrouter/z-ai/glm-5.2
    per_agent: {}

  # hybrid: DEFERRED.
  # Paperclip's `assigneeAdapterOverrides` can only merge config within the same
  # adapter type — it cannot swap adapter types per issue today. A true hybrid
  # variant would need that primitive (or an `ollama_local` adapter plugin).
