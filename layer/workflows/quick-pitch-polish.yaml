name: quick-pitch-polish
description: "Polish a pitch deck section or pitch email — routes through Chief of Staff to Marketing Lead to pitch-polisher specialist."
router: chief-of-staff
pipeline:
  - step: route
    agent: chief-of-staff
  - step: route
    agent: <determined-by-previous-step>
  - step: specialist
    agent: <determined-by-router-chain>
  - step: test
    suite: [scope-adherence, groundedness]
  - step: guardrail
    suite: []
on_test_failure: retry_with_better_model_then_escalate
on_guardrail_hit: escalate_to_human
