name: deep-review
description: "High-stakes matters. Three specialists draft in parallel at diverse temperatures; reconciler merges into a single deliverable."
router: chief-counsel
pipeline:
  - step: route
    agent: chief-counsel
  - step: route
    agent: <determined-by-previous-step>
  - step: parallel
    count: 3
    temperatures: [0.2, 0.7, 1.0]
    resolved_by: router
  - step: reconcile
    agent: reconciler
  - step: test
    suite: [groundedness, scope-adherence, citation-required]
  - step: guardrail
    suite: [signed-document]
on_test_failure: retry_with_better_model_then_escalate
on_guardrail_hit: escalate_to_human
