name: quick-intake-reply
description: Design a new-client intake form — routes through Chief of Staff to Marketing Lead to intake-form-drafter specialist.
router: chief-of-staff
pipeline:
  - step: route
    agent: chief-of-staff
  - step: route
    agent: <determined-by-previous-step>
  - step: specialist
    agent: <determined-by-router-chain>
  - step: test
    suite: [scope-adherence]
  - step: guardrail
    suite: []
on_test_failure: retry_with_better_model_then_escalate
on_guardrail_hit: escalate_to_human
