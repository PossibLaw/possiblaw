name: quick-counsel-with-cos
description: "Fast turnaround for low-stakes matters — routed through Chief of Staff (3-hop: cos -> chief-counsel -> commercial-lead -> specialist)"
router: chief-of-staff
pipeline:
  - step: route
    agent: chief-of-staff
  - step: route
    agent: <determined-by-previous-step>
  - step: route
    agent: <determined-by-previous-step>
  - step: specialist
    agent: <determined-by-router-chain>
  - step: test
    suite: [groundedness]
  - step: guardrail
    suite: [signed-document]
on_test_failure: retry_with_better_model_then_escalate
on_guardrail_hit: escalate_to_human
