name: signed-document
kind: guardrail
type: stub
description: |
  Signed-document risk gate. ANY action that produces or sends a document
  for signature requires a licensed lawyer's review. The Sprint 1a stub
  blocks all such actions unconditionally; refined in Sprint 2 to detect
  actual signature-bound content.
triggers:
  - action_type: signature_request
  - output_kind: contract_draft
  - output_kind: signed_document
stub_result:
  human_required: true
  reason_template: |
    This action triggers the signed-document risk gate.
    A licensed reviewing lawyer must approve before any signed document
    is sent. The Sprint 1a stub blocks all such actions unconditionally.
